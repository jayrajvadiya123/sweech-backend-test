version: '3.9'

services:
  app:
    container_name: nest-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgres://postgres:root@db:5432/postgres?schema=sweech
      JWT_SECRET: your_256_bit_hex_secret_here
    depends_on:
      - db
    volumes:
      - ./src:/usr/src/app/src
      - ./prisma:/usr/src/app/prisma

  db:
    container_name: postgres-db
    image: postgres:16
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
